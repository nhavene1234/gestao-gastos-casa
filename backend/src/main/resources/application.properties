spring.application.name=gestao-gastos-casa
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/casaconta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
# JWT
app.jwt.secret=troca-esta-chave-por-uma-frase-longa-com-pelo-menos-32-caracteres-2026
app.jwt.expiracao-minutos=480

# Admin inicial (criado no primeiro arranque)
app.admin.nome=Administrador
app.admin.email=admin@casa.com
app.admin.senha=Admin@123

# Mostrar mensagens de erro na API
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Alertas de média
app.alerta.meses-historico=12
app.alerta.meses-minimos=2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
